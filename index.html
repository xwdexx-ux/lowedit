<style>
@font-face{font-family:"Lowend Inter";src:url(/font.ttf) format("truetype");font-weight:300;font-style:normal;font-display:swap}
:root{--a:#fff;--b:#8a8a8a;--ink:#000;--text:#fff;--muted:#8a8a8a;--glass:#0d0d0d;--edge:#242424;--track:#2a2a2a;--thumb:#fff;--onA:#000;--playbg:#fff;--playfg:#000;--field:#000;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}html{touch-action:manipulation}
body{background:var(--ink);color:var(--text);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.logo{font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--a)}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.grid>*,.card{min-width:0}
@media(min-width:860px){.grid{grid-template-columns:420px minmax(0,1fr);align-items:start}}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:20px}
.cover{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 24px 60px #0007;transition:transform .08s linear;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover.has img{display:block}
.cover span{font:800 90px "Bricolage Grotesque",sans-serif;opacity:.5}
.cover.has span{display:none}
canvas{width:100%;height:56px;display:block;margin:16px 0 4px}
.title{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;gap:14px;margin-top:12px}
.play{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--playbg);color:var(--playfg);font-size:20px;cursor:pointer;transition:transform .12s}
.play:active{transform:scale(.94)}
.play:disabled{opacity:.35;cursor:not-allowed}
.time{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.seekbox{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--a) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--thumb);margin-top:-7px;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--a)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--thumb)}
input[type=range]:disabled{opacity:.4}
h2{font:800 18px "Bricolage Grotesque",sans-serif;margin-bottom:10px}
.src{display:flex;gap:8px}
.src input[type=text]{flex:1;min-width:0;background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit}
.src input::placeholder{color:#a59cc488}
.btn{border:0;border-radius:14px;padding:12px 16px;font:600 15px "Instrument Sans",sans-serif;cursor:pointer;background:var(--a);color:var(--onA)}
.btn.ghost{background:var(--glass);border:1px solid var(--edge);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.drop{margin-top:10px;display:block;text-align:center;border:1.5px dashed var(--edge);border-radius:14px;padding:16px;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--a);color:var(--text)}
.drop input{position:absolute;opacity:0;pointer-events:none}
.fx{margin-top:18px}
.ctl{padding:14px 0;border-top:1px solid var(--edge)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline}
.ctl label{font-weight:600}
.ctl output{font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--a)}
.dl{width:100%;margin-top:18px;padding:16px;font-size:16px}
.status{min-height:22px;margin-top:10px;text-align:center;color:var(--muted);font-size:14px}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.card{border-radius:18px;backdrop-filter:none;-webkit-backdrop-filter:none}
.cover{background:#161616;box-shadow:none;border-radius:12px}
.cover span{opacity:.25;width:46%;height:46%;display:block}
.item{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--edge)}
.item:first-child{border-top:0}
.item .meta{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:13px}
.sm{padding:9px 13px;font-size:14px}
.chip[aria-pressed=true]{background:var(--a);color:var(--onA);border-color:transparent;font-weight:600}
#welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 28%,#232323,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .6s,visibility .6s}
#welcome.out{opacity:0;visibility:hidden}
.w-sub{color:var(--muted);letter-spacing:.35em;text-transform:uppercase;font-size:12px}
.w-logo{font:800 clamp(64px,22vw,150px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-bottom:.2em;background:linear-gradient(180deg,#fff 0%,#a8a8a8 47%,#fff 50%,#4d4d4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-reflect:below -.1em linear-gradient(transparent 38%,rgba(255,255,255,.3))}
.w-card{margin-top:30px;width:min(340px,100%);padding:18px;border-radius:22px;background:linear-gradient(135deg,#ffffff22,#ffffff08);border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff45,0 20px 50px #000a;position:relative;overflow:hidden}
.w-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,#ffffff22 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4s infinite}
@keyframes sheen{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.w-card::after{animation:none}}
#nick{width:100%;background:#0006;border:1px solid var(--edge);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;text-align:center}
#notice{position:fixed;top:12px;left:12px;right:12px;z-index:90;padding:14px 16px;border-radius:16px;background:var(--text);color:var(--ink);font-weight:600;box-shadow:0 10px 40px #000a;cursor:pointer}
#notice[hidden]{display:none}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--a);color:var(--onA);margin-left:6px;font-weight:600}

.av{width:36px;height:36px;border-radius:50%;background:#1a1a1a center/cover no-repeat;border:1px solid var(--edge);display:grid;place-items:center;font:800 15px "Bricolage Grotesque",sans-serif;color:var(--text);cursor:pointer;flex:none;padding:0}
.av.big{width:120px;height:120px;font-size:48px;margin:0 auto;cursor:default}
#profile{position:fixed;inset:0;z-index:95;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
#profile[hidden]{display:none}
#profile .btn{width:100%;margin-top:8px}

.langb{font-weight:700;letter-spacing:.04em;min-width:46px}
#langBtnW{position:absolute;top:14px;right:14px}
#welcome{position:fixed}
:root[data-theme=light]{--a:#000;--b:#555;--ink:#fff;--text:#000;--muted:#666;--glass:#f3f3f3;--edge:#dadada;--track:#d2d2d2;--thumb:#000;--onA:#fff;--playbg:#000;--playfg:#fff;--field:#fff;color-scheme:light}
[data-theme=light] .cover{background:#e8e8e8}
[data-theme=light] .av{background:#e8e8e8}
[data-theme=light] .src input::placeholder,[data-theme=light] #nick::placeholder{color:#00000066}
[data-theme=light] #welcome{background:radial-gradient(ellipse at 50% 28%,#fff,#e4e4e4 70%)}
[data-theme=light] .w-logo{background:linear-gradient(180deg,#000 0%,#5a5a5a 47%,#000 50%,#b5b5b5 100%);-webkit-background-clip:text;background-clip:text}
[data-theme=light] .w-card{background:linear-gradient(135deg,#00000012,#00000005);border-color:#00000026;box-shadow:inset 0 1px 0 #fff,0 20px 50px #0002}
[data-theme=light] .w-card::after{background:linear-gradient(110deg,transparent 35%,#ffffff99 50%,transparent 65%)}
[data-theme=light] #nick{background:#fff}
[data-theme=light] input[type=range]::-webkit-slider-thumb{box-shadow:0 2px 8px #0004}
[data-theme=light] .cover{box-shadow:none}

.ctls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctls .ctl,.ctls .ctl:first-of-type{border:1px solid var(--edge);border-radius:16px;padding:12px 14px 6px}
.ctls .ctl.full{grid-column:1/-1}
.ctls .ctl .top{flex-direction:column;align-items:flex-start;gap:0}
.ctls .ctl.full .top{flex-direction:row;align-items:baseline;justify-content:space-between}
.ctls .ctl label{font-size:14px;color:var(--muted)}
.ctls .ctl output{font-size:26px;white-space:nowrap}
.ctls .ctl.full output{font-size:34px}
.ctls input[type=range]{height:44px}
.ctls input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:12px}
.ctls input[type=range]::-webkit-slider-thumb{width:30px;height:30px;margin-top:-9px}
.ctls input[type=range]::-moz-range-track,.ctls input[type=range]::-moz-range-progress{height:12px;border-radius:12px}
.ctls input[type=range]::-moz-range-thumb{width:30px;height:30px}

/* заглушка обложки: белые скруглённые полоски на чистом чёрном */
.cover{background:#000;border:1px solid var(--edge)}
.cover span{opacity:1;color:#fff}
[data-theme=light] .cover{background:#000}
/* премиум */
.prem-sub{color:var(--muted);margin:-4px 0 14px}
.pv{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;display:grid;place-items:center;text-align:center;color:#fff;margin-bottom:14px}
.pv{container-type:inline-size}
.pv-t{font:300 clamp(18px,5.4vw,30px)/1.095 "Lowend Inter",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:8.44cqw;transform:scaleX(.71);opacity:0;animation:pvfade 8s infinite}
.pv-bar{position:absolute;left:0;bottom:0;height:4px;background:#fff;width:0;animation:pvbar 8s linear infinite}
@keyframes pvfade{0%,6%{opacity:0}34%,92%{opacity:1}100%{opacity:0}}
@keyframes pvbar{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.pv-t{animation:none;opacity:1}.pv-bar{animation:none;width:40%}}
.prem-list{margin:10px 0 16px 6px;padding-left:22px;color:var(--muted);font-size:15px}
.prem-list li{margin:6px 0}
#premActive{margin:0 0 12px;color:var(--text);font-weight:600}
#users .item{flex-wrap:wrap}

/* меню + lowedit AI (чат) */
.logoRow{display:flex;align-items:center}
.menub,.ai-ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin:0;padding:0;border:0;background:transparent;color:var(--text);border-radius:12px;cursor:pointer;flex:none}
.menub{margin-left:-8px;margin-right:6px}
.menub:hover,.ai-ib:hover{background:var(--glass)}
.menub svg,.ai-ib svg{width:22px;height:22px}
#drawer{position:fixed;inset:0;z-index:80}
#drawer[hidden],#aiApp[hidden]{display:none}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#drawer .panel{position:relative;width:min(300px,84vw);height:100%;background:var(--glass);border-right:1px solid var(--edge);padding:calc(14px + env(safe-area-inset-top)) 12px 16px;display:flex;flex-direction:column;gap:4px;transform:translateX(-100%);transition:transform .22s ease}
#drawer.open .scrim{opacity:1}#drawer.open .panel{transform:none}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px 10px;font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.ditem{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:12px;border:0;border-radius:12px;background:transparent;color:var(--text);font:500 16px "Instrument Sans",sans-serif;text-align:left;cursor:pointer}
.ditem:hover,.ditem.on{background:var(--track)}
.ditem svg{width:20px;height:20px;flex:none}
.dsec{margin:14px 10px 6px;font:600 12px "Instrument Sans",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#dChats{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.crow{display:flex;align-items:center;border-radius:12px;flex:none}
.crow:hover,.crow.on{background:var(--track)}
.crow .ct{flex:1;min-width:0;margin:0;padding:11px 12px;border:0;background:transparent;color:var(--text);font:400 15px "Instrument Sans",sans-serif;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cx{flex:none;width:36px;height:36px;margin:0 4px 0 0;padding:0;border:0;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.crow .cx:hover{color:var(--text)}
.crow .cx svg{width:18px;height:18px}
#dNone{color:var(--muted);padding:6px 12px;font-size:14px}
#dNone[hidden]{display:none}
#aiApp{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--ink);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overscroll-behavior:none}
.ai-top{touch-action:none;flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.ai-title{font:600 16px "Instrument Sans",sans-serif}
.ai-feed{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 16px}
.ai-col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ai-empty{text-align:center;margin-top:14vh}
.ai-empty h1{font:800 38px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.ai-empty p{color:var(--muted);margin-top:6px}
.ai-sug{display:flex;flex-direction:column;gap:8px;margin-top:26px;align-items:stretch}
.ai-sug button{margin:0;text-align:left;padding:12px 16px;border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:16px;font:400 15px "Instrument Sans",sans-serif;cursor:pointer}
.ai-sug button:hover{border-color:var(--a)}
.msg{overflow-wrap:anywhere;white-space:pre-wrap}
.msg.u{align-self:flex-end;max-width:85%;background:var(--glass);border:1px solid var(--edge);padding:10px 14px;border-radius:18px}
.msg.a{align-self:flex-start;max-width:100%;line-height:1.6}
.msg.a.err{color:var(--muted)}
.ai-w{animation:aiw .6s ease-out both}
@keyframes aiw{from{opacity:0}to{opacity:1}}
.ai-acts{display:flex;align-items:center;gap:2px;margin-top:10px;white-space:normal;margin-left:-8px}
.ai-acts button{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;-webkit-tap-highlight-color:transparent}
.ai-acts button:active{background:var(--glass)}
.ai-acts button.on{color:var(--text,#fff)}
.ai-acts svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ai-disc{color:var(--muted);font-size:13px;margin-top:6px;white-space:normal}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-tag{border:1px solid var(--edge);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted);white-space:normal}
button.ai-tag{margin:0;background:var(--a);color:var(--onA);border-color:transparent;font-weight:600;cursor:pointer}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;min-width:0}
.think{gap:12px}.think .dots{position:relative;flex:none;width:16px;height:14px}.think .dots i{position:absolute;left:0;top:5.5px;width:3.4px;height:3.4px;border-radius:50%;background:var(--text);will-change:transform}.think .dots i:nth-child(1){animation:dA 1.7s ease-in-out infinite}.think .dots i:nth-child(2){animation:dB 1.3s ease-in-out infinite}.think .dots i:nth-child(3){animation:dC 1.9s ease-in-out infinite}@keyframes dA{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(2px,-3px) scale(.7)}50%{transform:translate(1px,2.5px) scale(1.15)}75%{transform:translate(-.5px,-1px) scale(.8)}}@keyframes dB{0%,100%{transform:translate(6px,0) scale(.6)}30%{transform:translate(7px,-4px) scale(1.15)}60%{transform:translate(5px,3px) scale(.85)}}@keyframes dC{0%,100%{transform:translate(12px,0) scale(1.1)}35%{transform:translate(11px,3px) scale(.65)}70%{transform:translate(13px,-3px) scale(1)}}.think b{transition:opacity .2s}
.think svg{flex:none;width:18px;height:18px;animation:tkp 1.6s ease-in-out infinite}
.think b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;background:linear-gradient(90deg,var(--muted) 30%,var(--text) 50%,var(--muted) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:tks 2s linear infinite}
@keyframes tkp{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes tks{from{background-position:100% 0}to{background-position:-100% 0}}
.ai-vid video{display:block;width:100%;max-width:320px;max-height:60vh;margin-top:10px;border-radius:14px;background:#000}
.ai-vid .ai-tags{margin-top:10px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--muted);animation:aid 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes aid{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-comp{flex:none;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
#aiApp.kb .ai-comp{padding-bottom:8px}
.ai-box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:6px}
.ai-box .ai-in{flex:1;align-self:center;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:400 16px/1.45 "Instrument Sans",system-ui,sans-serif;max-height:140px;min-height:1.45em;overflow-y:auto;padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;-webkit-tap-highlight-color:transparent;cursor:text}
.ai-in.empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
#aiApp.kb .ai-note{display:none}
.ai-send{flex:none;width:38px;height:38px;margin:0;padding:0;border:0;border-radius:50%;background:var(--a);color:var(--onA);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ai-send:disabled{opacity:.3;cursor:not-allowed}
.ai-note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

html.ai-lock,html.ai-lock body{overflow:hidden;overscroll-behavior:none}
html.ai-lock .wrap{visibility:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.ai-plus:hover{background:var(--track)}
.ai-plus.on{transform:rotate(45deg)}
.ai-pop{max-width:720px;margin:0 auto 8px;background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:6px;display:flex;flex-direction:column}
.ai-pop[hidden]{display:none}
.ai-pop button{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:12px;border:0;border-radius:12px;background:transparent;color:var(--text);font:500 15px "Instrument Sans",sans-serif;text-align:left;cursor:pointer}
.ai-pop button:hover,.ai-pop button:active{background:var(--track)}
.ai-pop svg{width:20px;height:20px;flex:none}
.ai-atts{max-width:720px;margin:0 auto 8px;display:flex;gap:8px;overflow-x:auto;padding:2px}
.ai-atts:empty{display:none}
.att{position:relative;flex:none;width:64px;height:64px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);overflow:hidden;display:flex;align-items:center;justify-content:center}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att.file{width:auto;min-width:64px;max-width:150px;padding:0 12px;flex-direction:column;gap:2px;color:var(--muted);font-size:11px}
.att.file b{color:var(--text);font:700 13px "Instrument Sans",sans-serif}
.att.file .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.load{opacity:.5;animation:aid 1.2s infinite}
.att .x{position:absolute;top:3px;right:3px;width:20px;height:20px;margin:0;padding:0;border:0;border-radius:50%;background:#000c;color:#fff;font-size:13px;line-height:20px;cursor:pointer}
.att .vb{position:absolute;left:4px;bottom:4px;font-size:10px;line-height:1;background:#000c;color:#fff;border-radius:6px;padding:3px 5px}
.ai-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:flex-end}
.ai-thumbs .att{width:72px;height:72px}
.ai-thumbs .att.file{width:auto;min-width:72px}
#aiApp.drag{outline:2px dashed var(--a);outline-offset:-8px}
/* чат не должен ездить: страница под ним намертво закреплена, пока чат открыт (iOS иначе прокручивает её при клавиатуре) */

.think .pbar i{display:block;height:100%;width:0;background:var(--text);border-radius:3px;transition:width .5s linear}
.ai-vidgone{margin-top:10px;color:var(--muted);font-size:14px}

const toBottom=()=>{feed.scrollTop=feed.scrollHeight};
function tile(a){const d=document.createElement('div');if(a.src){d.className='att';const i=document.createElement('img');i.src=a.src;i.alt='';d.appendChild(i)}else{d.className='att file';d.innerHTML='<b></b><span class="n"></span>';d.firstChild.textContent=(a.k||'file').toUpperCase().slice(0,5);d.lastChild.textContent=a.n||''}if(a.num){const nb=document.createElement('span');nb.className='nb';nb.textContent=a.num;d.appendChild(nb)}return d}
/* номера видео считаются внутри чата: так их и называет человек, и так их видит ИИ */
const chatFiles=()=>{const o=[];cur.msgs.forEach(m=>(m.atts||[]).forEach(a=>{if(a.name&&!o.includes(a.name))o.push(a.name)}));return o};
function drawUser(m){const d=document.createElement('div');d.className='msg u';
  if(m.atts&&m.atts.length){const w=document.createElement('div');w.className='ai-thumbs';const cf=chatFiles();m.atts.forEach(a=>w.appendChild(tile({...a,num:cf.indexOf(a.name)+1||''})));d.appendChild(w)}
  const s=m.show!==undefined?m.show:m.text;if(s){const x=document.createElement('div');x.className='show';x.textContent=s;d.appendChild(x)}col.appendChild(d)}
function videoBlock(name){const u='/api/v/'+name+'?k='+tok,w=document.createElement('div');w.className='ai-vid';w.innerHTML='<video controls playsinline preload="metadata"></video><div class="ai-tags"><a class="ai-tag" download></a></div>';w.firstChild.src=u;const a=w.querySelector('a');a.href=u+'&dl=1';a.textContent=t('dl')+name;return w}
function mkA(){const el=document.createElement('div');el.className='msg a';const tx=document.createElement('div');tx.className='txt';tx.hidden=true;const vs=document.createElement('div');el.append(tx,vs);return{el,tx,vs}}
function addActs(A,isLast){const row=document.createElement('div');row.className='ai-acts';
  const cp=document.createElement('button');cp.setAttribute('aria-label',t('copy'));cp.innerHTML=ICON.copy;cp.onclick=async()=>{try{await navigator.clipboard.writeText(A.tx.textContent);cp.innerHTML=ICON.check;cp.classList.add('on');setTimeout(()=>{cp.innerHTML=ICON.copy;cp.classList.remove('on')},1400)}catch(e){}};
  row.appendChild(cp);
  if(isLast){const rt=document.createElement('button');rt.setAttribute('aria-label',t('retry'));rt.innerHTML=ICON.retry;rt.onclick=retry;row.appendChild(rt)}
  A.el.appendChild(row);return row}
function drawAssist(m,isLast){const A=mkA();if(m.text){A.tx.hidden=false;A.tx.innerHTML=fmt(m.text);if(m.err)A.el.classList.add('err')}(m.videos||[]).forEach(n=>A.vs.appendChild(videoBlock(n)));if(m.text&&!m.err)addActs(A,isLast);col.appendChild(A.el)}
function render(){col.innerHTML='';
  if(!cur.msgs.length){const e=document.createElement('div');e.className='ai-empty';e.innerHTML='<h1></h1><p></p><div class="ai-sug"></div>';e.querySelector('h1').textContent=t('hello');e.querySelector('p').textContent=t('sub');
    ['s1','s2','s3'].forEach(k=>{const b=document.createElement('button');b.textContent=t(k);b.onclick=()=>{$('aiIn').value=t(k);submit()};e.querySelector('.ai-sug').appendChild(b)});col.appendChild(e)}
  else cur.msgs.forEach((m,i)=>m.role==='u'?drawUser(m):drawAssist(m,i===cur.msgs.length-1));
  toBottom()}

/* ---- composer ---- */
const inp=$('aiIn');
function upd(){const has=!!inp.value.trim()||atts.some(a=>a.name);const s=$('aiSend');s.classList.toggle('stop',busy);s.setAttribute('aria-label',busy?t('stop'):t('send'));s.disabled=busy?false:(!has||atts.some(a=>!a.name&&!a.failed))}
inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';upd()};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();if(!busy)submit()}});
$('aiPlus').onclick=()=>$('flMedia').click();
function redrawAtts(){const box=$('aiAtts');box.innerHTML='';const base=chatFiles().length;atts.forEach((a,i)=>{const d=tile({src:a.src,n:a.orig,k:a.kind,num:base+i+1});if(!a.name)d.classList.add('load');const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Remove');x.onclick=()=>{try{a.xhr&&a.xhr.abort()}catch(e){}atts=atts.filter(z=>z!==a);redrawAtts();upd()};d.appendChild(x);if(!a.name){const v=document.createElement('span');v.className='vb';v.textContent=(a.pct||0)+'%';d.appendChild(v)}box.appendChild(d)})}
function onFiles(inputEl){for(const f of inputEl.files){const ext=((f.name.match(/\.(\w{1,5})$/)||[])[1]||(f.type.split('/')[1]||'file')).toLowerCase();
  const a={orig:f.name,kind:ext,src:f.type.startsWith('image/')?URL.createObjectURL(f):'',pct:0};atts.push(a);
  const x=new XMLHttpRequest();a.xhr=x;x.open('POST','/api/upload?name='+encodeURIComponent(f.name));x.setRequestHeader('Authorization','Bearer '+tok);
  x.upload.onprogress=e=>{a.pct=Math.round(e.loaded/(e.total||1)*100);redrawAtts()};
  x.onload=()=>{try{a.name=JSON.parse(x.responseText).name}catch(e){atts=atts.filter(z=>z!==a);toast(f.name+': '+t('err'))}redrawAtts();upd()};
  x.onerror=()=>{atts=atts.filter(z=>z!==a);redrawAtts();toast(f.name+': '+t('err'));upd()};x.send(f)}
  inputEl.value='';redrawAtts();upd()}
$('flMedia').onchange=()=>onFiles($('flMedia'));

/* ---- send + stream ---- */
$('aiSend').onclick=()=>{if(busy){try{ctl&&ctl.abort()}catch(e){}return}submit()};
function submit(){if(busy)return;const text=inp.value.trim(),ready=atts.filter(a=>a.name);if(!text&&!ready.length)return;
  const um={role:'u',text:text||(lang==='ru'?'Посмотри видео':'Take a look at the videos'),show:text,atts:ready.map(a=>({n:a.orig,k:a.kind,name:a.name}))};
  atts=[];redrawAtts();inp.value='';inp.style.height='auto';go(um)}
function retry(){if(busy)return;while(cur.msgs.length&&cur.msgs[cur.msgs.length-1].role==='a')cur.msgs.pop();const u=cur.msgs.pop();if(!u)return;go(u)}
async function go(um){
  const hist=cur.msgs.map(x=>({role:x.role,text:x.text||''}));
  cur.msgs.push(um);render();busy=true;upd();
  const th=document.createElement('div');th.className='msg a think';th.setAttribute('role','status');th.innerHTML='<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><b></b>';
  const lab=th.querySelector('b');lab.textContent=t('think')+'…';col.appendChild(th);toBottom();
  let A=null,txt='',vids=[],newPara=false,failed='';ctl=new AbortController();
  const ensureA=()=>{if(!A){A=mkA();col.insertBefore(A.el,th)}return A};
  try{
    const r=await api('/api/chat',{method:'POST',signal:ctl.signal,body:JSON.stringify({message:um.text,history:hist,files:chatFiles()})});
    if(!r.ok){let e=t('err');try{e=(await r.json()).error||e}catch(x){}failed=e}
    else{const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
        for(const l of ls){if(!l)continue;let o;try{o=JSON.parse(l)}catch(x){continue}const nb=nearBottom();
          if(o.t==='delta'){const a=ensureA();if(newPara&&txt){txt+='\n\n';newPara=false}txt+=o.text;a.tx.hidden=false;a.tx.innerHTML=fmt(txt);th.hidden=true}
          else if(o.t==='say'){const a=ensureA();txt+=(txt?'\n\n':'')+o.text;a.tx.hidden=false;a.tx.innerHTML=fmt(txt)}
          else if(o.t==='turn')newPara=true;
          else if(o.t==='step'){lab.textContent=t(o.k)+'…';th.hidden=false}
          else if(o.t==='video'){vids.push(o.name);ensureA().vs.appendChild(videoBlock(o.name))}
          else if(o.t==='done'){th.hidden=true}
          if(nb)toBottom()}}}
  }catch(e){if(!(e&&e.name==='AbortError'))failed=t('lost')}
  th.remove();ctl=null;busy=false;
  if(failed&&!txt&&!vids.length){saveThread();drawAssist({role:'a',text:failed,err:true},false)}
  else if(txt||vids.length){cur.msgs.push({role:'a',text:txt,videos:vids});saveThread();render()}
  else saveThread();
  upd();toBottom()}
render();applyLang();paintAvs();
if(localStorage.getItem('lowedit_in')==='1'){$('welcome').classList.add('out');hello()}
</script></body></html>
